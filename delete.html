<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Account - Herd</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #111; color: #fff; }
        h1 { color: #f5c842; }
        a { color: #f5c842; }
        .box { background: #222; padding: 20px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>HERD</h1>
    <h2>Delete Your Account</h2>
    <div class="box">
        <p>To delete your account and all associated data:</p>
        <p><strong>Option 1 (In-app):</strong> Open the Herd app → Settings → Delete Account</p>
        <p><strong>Option 2 (Email):</strong> Send a deletion request to <a href="mailto:info@bherd.uk">info@bherd.uk</a></p>
        <p>Your account and all data will be permanently deleted within 30 days.</p>
    </div>
</body>
</html>
